<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial Compute Design System</title><style>
*{box-sizing:border-box}body{margin:0;background:#090B10;color:#e2e2e9;font-family:Arial,sans-serif}.board{width:1000px;height:565px;padding:18px;background:#111318;display:grid;grid-template-columns:220px 1fr 1fr 1.1fr;gap:12px}.stack{display:grid;gap:10px}.card{background:#1e1f25;border:1px solid #282a2f;border-radius:10px;padding:18px}.swatch{height:118px;padding:15px;border-radius:8px;position:relative;color:white}.swatch small{position:absolute;right:12px;top:14px;font-family:monospace}.swatch .ramp{position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(90deg,#001849,#003fa4,#0066ff,#8aa8ff,#eef0ff)}.violet .ramp{background:linear-gradient(90deg,#1d0061,#4914cb,#7d5bff,#bdaeff,#e6deff)}.cyan .ramp{background:linear-gradient(90deg,#00201a,#005144,#00f5d4,#8ffff0,#e1fff6)}.neutral .ramp{background:linear-gradient(90deg,#000,#282a2f,#8c90a1,#fff)}.blue{background:#0066ff}.violet{background:#7d5bff}.cyan{background:#00f5d4;color:#06251f}.neutral{background:#090b10}.type{font-size:88px;text-align:center}.meta{font-size:12px;color:#8B949E;display:flex;justify-content:space-between}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:9px;border-radius:3px;border:1px solid #424656;background:#1a1b21;color:#e2e2e9}.primary{background:#b3c5ff;color:#002b75}.search{border:1px solid #424656;background:#1a1b21;padding:14px;color:#8b949e}.lines i{display:block;height:7px;margin:13px 0;background:#b3c5ff}.lines i:nth-child(2){width:80%;background:#cbbeff}.lines i:nth-child(3){width:62%;background:#00dfc1}.icons{display:flex;gap:18px;align-items:center;justify-content:center;font-size:28px}.chip{background:#0066ff;padding:9px 16px;font-family:monospace}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tiles b{display:grid;place-items:center;height:42px;color:#111318}.tiles b:nth-child(1){background:#b3c5ff}.tiles b:nth-child(2){background:#cbbeff}.tiles b:nth-child(3){background:#00dfc1}.tiles b:nth-child(4){background:#ffb4ab}.tiles b:nth-child(5){background:#8c90a1}
</style></head><body><main class="board"><section class="stack"><div class="swatch blue">Primary<small>#0066FF</small><div class="ramp"></div></div><div class="swatch violet">Secondary<small>#7D5BFF</small><div class="ramp"></div></div><div class="swatch cyan">Tertiary<small>#00F5D4</small><div class="ramp"></div></div><div class="swatch neutral">Neutral<small>#090B10</small><div class="ramp"></div></div></section><section class="stack"><div class="card"><div class="meta"><span>Headline</span><span>Space Grotesk</span></div><div class="type">Aa</div></div><div class="card"><div class="meta"><span>Body</span><span>Hanken Grotesk</span></div><div class="type">Aa</div></div><div class="card"><div class="meta"><span>Label</span><span>JetBrains Mono</span></div><div class="type">Aa</div></div></section><section class="stack"><div class="card buttons"><button class="btn primary">Primary</button><button class="btn">Secondary</button><button class="btn">Inverted</button><button class="btn">Outlined</button></div><div class="card lines"><i></i><i></i><i></i></div><div class="card icons">⌂⌕♙</div></section><section class="stack"><div class="card search">⌕&nbsp;&nbsp; Search</div><div class="card icons">⌂&nbsp;&nbsp;⌕&nbsp;&nbsp;♙</div><div class="card"><div class="tiles"><b>↗</b><b>♙</b><b>◇</b><b>⌫</b><b>＋</b></div></div><div class="card"><span class="chip">⌕ Label</span></div></section></main></body></html>
